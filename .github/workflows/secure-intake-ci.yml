name: Secure Intake CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [secure-intake]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Check serverless function syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find netlify -type f -name '*.mjs' -print0)


      - name: Diagnose production portal health
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/portal-health.json -w "%{http_code}" https://mixedbyrashid.netlify.app/api/portal-health || true)
          echo "HTTP $code"
          cat /tmp/portal-health.json 2>/dev/null || true
