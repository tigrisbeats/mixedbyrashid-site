<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Forgot Password | MixedByRashid</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css">
<style>
.auth-wrap{max-width:560px;margin:7vh auto}.auth-card{border:1px solid var(--line);border-radius:20px;padding:22px;background:#111116}
.auth-grid{display:grid;gap:12px}.auth-grid input{width:100%;box-sizing:border-box;background:#0d0d11;color:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit}
.note{color:var(--muted);font-size:13px}.status{margin-top:14px}.status.good{color:#9cf0b6}.status.error{color:#ff9b9b}
</style>
</head>
<body class="portal-page">
<nav class="portal-nav"><div class="shell nav-inner"><a class="brand" href="/">Mixed<span>By</span>Rashid</a><a class="btn secondary" href="/login">Back to Login</a></div></nav>
<main class="shell auth-wrap">
<section class="auth-card">
<div class="eyebrow">Account Recovery</div>
<h1>Reset your password.</h1>
<p>Enter the email address tied to your MixedByRashid portal account. We’ll send a secure password-reset link.</p>
<form class="auth-grid" id="recoveryForm">
<input id="email" name="email" type="email" autocomplete="email" placeholder="Email" required>
<button class="btn" id="submitButton" type="submit">Send Reset Link</button>
</form>
<div id="status" class="note status"></div>
<p class="note">Check Spam, Junk, Promotions, and All Mail if the message does not appear in your inbox.</p>
</section>
</main>
<script type="module">
const form=document.getElementById('recoveryForm');
const email=document.getElementById('email');
const button=document.getElementById('submitButton');
const status=document.getElementById('status');

form.addEventListener('submit', async (event)=>{
  event.preventDefault();
  const value=email.value.trim();
  if(!value)return;

  button.disabled=true;
  status.className='note status';
  status.textContent='Sending secure reset link…';

  try{
    const { requestPasswordRecovery } = await import('https://esm.sh/@netlify/identity@2.0.0');
    await requestPasswordRecovery(value);
    status.className='note status good';
    status.textContent='If that email is connected to an account, a reset link is on the way. Check your inbox and spam folders.';
    form.reset();
  }catch(error){
    console.error('password-recovery',error);
    status.className='note status error';
    status.textContent='We could not send the reset email right now. Please try again in a moment.';
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
