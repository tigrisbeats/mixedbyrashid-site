<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Set New Password | MixedByRashid</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css">
<style>
.auth-wrap{max-width:560px;margin:7vh auto}.auth-card{border:1px solid var(--line);border-radius:20px;padding:22px;background:#111116}
.auth-grid{display:grid;gap:12px}.auth-grid input{width:100%;box-sizing:border-box;background:#0d0d11;color:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit}
.note{color:var(--muted);font-size:13px}.status{margin-top:14px}.status.good{color:#9cf0b6}.status.error{color:#ff9b9b}.hidden{display:none!important}
</style>
</head>
<body class="portal-page">
<nav class="portal-nav"><div class="shell nav-inner"><a class="brand" href="/">Mixed<span>By</span>Rashid</a><a class="btn secondary" href="/login">Back to Login</a></div></nav>
<main class="shell auth-wrap">
<section class="auth-card">
<div class="eyebrow">Account Recovery</div>
<h1>Choose a new password.</h1>
<p id="copy">Checking your secure recovery link…</p>
<form class="auth-grid hidden" id="resetForm">
<input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="New password" required>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password" required>
<button class="btn" id="submitButton" type="submit">Save New Password</button>
</form>
<div id="status" class="note status"></div>
<p class="note hidden" id="recoveryLink"><a href="/forgot-password">Request another reset link.</a></p>
</section>
</main>
<script type="module">
const copy=document.getElementById('copy');
const form=document.getElementById('resetForm');
const password=document.getElementById('password');
const confirmPassword=document.getElementById('confirmPassword');
const button=document.getElementById('submitButton');
const status=document.getElementById('status');
const recoveryLink=document.getElementById('recoveryLink');

let identity;

async function prepare(){
  try{
    identity=await import('https://esm.sh/@netlify/identity@2.0.0');

    let user=null;
    if(location.hash.includes('recovery_token=')){
      const result=await identity.handleAuthCallback();
      if(result?.type!=='recovery')throw new Error('Invalid recovery callback.');
      user=result.user;
      history.replaceState(null,'',location.pathname);
    }else{
      user=await identity.getUser();
    }

    if(!user){
      copy.textContent='This recovery link is missing, expired, or has already been used.';
      status.className='note status error';
      status.textContent='Request a new password-reset email and open the newest link.';
      recoveryLink.classList.remove('hidden');
      return;
    }

    copy.textContent='Enter a new password with at least 8 characters.';
    status.textContent='';
    form.classList.remove('hidden');
  }catch(error){
    console.error('password-reset-prepare',error);
    copy.textContent='We could not open that recovery link.';
    status.className='note status error';
    status.textContent='Request a new password-reset email and try the newest link.';
    recoveryLink.classList.remove('hidden');
  }
}

form.addEventListener('submit', async (event)=>{
  event.preventDefault();
  if(password.value.length<8){
    status.className='note status error';
    status.textContent='Use at least 8 characters.';
    return;
  }
  if(password.value!==confirmPassword.value){
    status.className='note status error';
    status.textContent='Those passwords do not match.';
    return;
  }

  button.disabled=true;
  status.className='note status';
  status.textContent='Saving your new password…';

  try{
    await identity.updateUser({password:password.value});
    await identity.logout();
    status.className='note status good';
    status.textContent='Password updated. Sending you back to login…';
    form.classList.add('hidden');
    setTimeout(()=>location.replace('/login?reset=1'),900);
  }catch(error){
    console.error('password-reset-save',error);
    status.className='note status error';
    status.textContent='We could not update the password. Request a new reset link and try again.';
    recoveryLink.classList.remove('hidden');
    button.disabled=false;
  }
});

prepare();
</script>
</body>
</html>
