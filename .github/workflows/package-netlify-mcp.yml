name: Package Netlify Deploy Runner

on:
  push:
    branches: [ops/export-current-main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare deploy runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir netlify-runner
          cd netlify-runner
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @netlify/mcp@1.16.0

      - name: Package runner
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-offline
          path: netlify-runner
          include-hidden-files: true
          retention-days: 1
