# Deploy Preview refresh: Stripe sandbox environment verification
name: Production Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify and verify production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mixedbyrashid.netlify.app"

          ready=0
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/portal-health.json -w "%{http_code}" "$BASE/api/portal-health" || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            echo "Portal health attempt $attempt returned HTTP $code"
            cat /tmp/portal-health.json 2>/dev/null || true
            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo "Portal database did not become healthy."
            cat /tmp/portal-health.json 2>/dev/null || true
            exit 1
          fi

          grep -q '"ok":true' /tmp/portal-health.json

          page_ready=0
          for attempt in $(seq 1 18); do
            if curl -fsS -o /tmp/login.html "$BASE/login" \
              && grep -q "Open your project" /tmp/login.html \
              && grep -q 'id="nextPath"' /tmp/login.html; then
              page_ready=1
              break
            fi
            echo "Waiting for the current Netlify production deploy (attempt $attempt)"
            sleep 10
          done

          if [ "$page_ready" != "1" ]; then
            echo "The current login page did not become available."
            exit 1
          fi

          curl -fsS -o /tmp/verify-email.html "$BASE/verify-email"
          grep -q "Check your email" /tmp/verify-email.html

          curl -fsS -o /tmp/forgot-password.html "$BASE/forgot-password"
          grep -q "Reset your password" /tmp/forgot-password.html

          curl -fsS -o /tmp/reset-password.html "$BASE/reset-password"
          grep -q "Choose a new password" /tmp/reset-password.html

          grep -q "Forgot password?" /tmp/login.html

          curl -fsS -o /tmp/book.html "$BASE/book"
          grep -q "Dallas, Texas • Studio Booking" /tmp/book.html

          project_code=$(curl -sS -o /tmp/projects-unauth.json -w "%{http_code}" "$BASE/api/projects" || true)
          test "$project_code" = "401"

          storage_ready=0
          for attempt in $(seq 1 18); do
            storage_code=$(curl -sS \
              -H "x-mixedbyrashid-storage-smoke: storage-e2e-20260926-v1" \
              -o /tmp/storage-smoke.json \
              -w "%{http_code}" \
              -X POST \
              "$BASE/api/storage-smoke" || true)

            if [ "$storage_code" = "200" ]; then
              storage_ready=1
              break
            fi

            if [ "$storage_code" != "404" ]; then
              echo "Storage smoke returned HTTP $storage_code"
              cat /tmp/storage-smoke.json 2>/dev/null || true
              exit 1
            fi

            echo "Waiting for the current storage smoke function (attempt $attempt)"
            sleep 10
          done

          if [ "$storage_ready" != "1" ]; then
            echo "Storage smoke endpoint did not become available."
            cat /tmp/storage-smoke.json 2>/dev/null || true
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/storage-smoke.json", "utf8"));
            if (body.ok !== true) throw new Error("Storage smoke did not report success.");
            const expected = [
              "token_refresh",
              "folder_create",
              "file_request_create",
              "upload",
              "list",
              "temporary_download",
              "cleanup"
            ];
            for (const key of expected) {
              if (body.checks?.[key] !== true) {
                throw new Error("Storage smoke check failed: " + key);
              }
            }
          '
