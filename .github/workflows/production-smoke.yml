name: Production Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify and verify production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mixedbyrashid.netlify.app"

          ready=0
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/portal-health.json -w "%{http_code}" "$BASE/api/portal-health" || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            echo "Portal health attempt $attempt returned HTTP $code"
            cat /tmp/portal-health.json 2>/dev/null || true
            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo "Portal database did not become healthy."
            cat /tmp/portal-health.json 2>/dev/null || true
            exit 1
          fi

          grep -q '"ok":true' /tmp/portal-health.json

          page_ready=0
          for attempt in $(seq 1 18); do
            if curl -fsS -o /tmp/login.html "$BASE/login" \
              && grep -q "Open your project" /tmp/login.html \
              && grep -q 'id="nextPath"' /tmp/login.html; then
              page_ready=1
              break
            fi
            echo "Waiting for the current Netlify production deploy (attempt $attempt)"
            sleep 10
          done

          if [ "$page_ready" != "1" ]; then
            echo "The current login page did not become available."
            exit 1
          fi

          curl -fsS -o /tmp/verify-email.html "$BASE/verify-email"
          grep -q "Check your email" /tmp/verify-email.html

          curl -fsS -o /tmp/forgot-password.html "$BASE/forgot-password"
          grep -q "Reset your password" /tmp/forgot-password.html

          curl -fsS -o /tmp/reset-password.html "$BASE/reset-password"
          grep -q "Choose a new password" /tmp/reset-password.html

          grep -q "Forgot password?" /tmp/login.html

          curl -fsS -o /tmp/book.html "$BASE/book"
          grep -q "Dallas, Texas • Studio Booking" /tmp/book.html

          project_code=$(curl -sS -o /tmp/projects-unauth.json -w "%{http_code}" "$BASE/api/projects" || true)
          test "$project_code" = "401"

          curl -fsS -o /tmp/home.html "$BASE/"
          grep -q "Request Mixing" /tmp/home.html
          grep -q "Request Mastering" /tmp/home.html
          ! grep -q "4gM6oI5u91dS1aH0Cy4wM01" /tmp/home.html
          ! grep -q "00waEY6ydcWA2eLclg4wM02" /tmp/home.html

          grep -q "Schedule Extended Session" /tmp/book.html

          curl -fsS -o /tmp/admin.html "$BASE/admin"
          grep -q "Project control." /tmp/admin.html

          checkout_code=$(curl -sS \
            -H "Origin: $BASE" \
            -H "Referer: $BASE/" \
            -H "Content-Type: application/json" \
            -o /tmp/checkout-disabled.json \
            -w "%{http_code}" \
            -X POST \
            --data '{"service":"studio","hours":2}' \
            "$BASE/api/create-checkout" || true)
          test "$checkout_code" = "503"

          webhook_code=$(curl -sS \
            -H "Content-Type: application/json" \
            -o /tmp/webhook-invalid.json \
            -w "%{http_code}" \
            -X POST \
            --data '{}' \
            "$BASE/api/stripe-webhook" || true)
          test "$webhook_code" = "400"
          grep -q "Invalid Stripe signature" /tmp/webhook-invalid.json
